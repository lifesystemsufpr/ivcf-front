name: Build and deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment that provides the deployment secrets
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE" > .env

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate deployment configuration
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          missing=()

          for variable in SSH_HOST SSH_USERNAME SSH_KEY SSH_PORT DEPLOY_PATH; do
            if [ -z "${!variable}" ]; then
              missing+=("$variable")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing configuration in GitHub Environment '${{ inputs.environment }}': ${missing[*]}"
            exit 1
          fi

          if ! grep -q -- "PRIVATE KEY-----" <<< "$SSH_KEY"; then
            echo "::error::SSH_KEY does not contain a complete private SSH key"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: dist/*
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 1
